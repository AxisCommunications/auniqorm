[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "auniqorm-native"
dynamic = ["version"]
description = "Native database engine for aUniqORM (Rust/tokio/sqlx)"
requires-python = ">=3.12"
license = "MIT"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "auniqorm_native"
features = ["pyo3/extension-module"]
