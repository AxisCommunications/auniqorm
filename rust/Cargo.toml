[package]
name = "auniqorm-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "auniqorm_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "time", "uuid", "rust_decimal"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-postgres = "0.7"
deadpool-postgres = "0.14"
postgres-types = { version = "0.2", features = ["with-time-0_3", "with-uuid-1"] }
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
bytes = "1"
rmp = "0.8"
mongodb = { version = "3.9", default-features = false, features = ["compat-3-0-0", "dns-resolver", "rustls-tls"] }
bson = "3.1"
# PostgreSQL value types (time, uuid and serde_json are already linked via bson).
time = { version = "0.3", default-features = false }
uuid = { version = "1", default-features = false }
rust_decimal = { version = "1", default-features = false, features = ["std", "db-postgres"] }
serde_json = "1"
# Native PostgreSQL TLS (rustls is already linked through mongodb/mysql_async).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false }

# Ship small, fast wheels: fat LTO drops unused code from the statically linked
# crates (tokio-postgres, mysql_async, rusqlite, rustls, …) and strip removes
# the symbol table. opt-level stays at 3 (speed) and panic stays "unwind" so
# PyO3 can turn Rust panics into Python exceptions.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

# Release-grade codegen plus symbols for profilers. Build with `--profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
